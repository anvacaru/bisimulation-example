[tool.poetry]
name = "bisimulation-example"
version = "0.1.0"
description = ""
authors = ["Andrei <16517508+anvacaru@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
black = "*"
mypy = "*"
flake8 = "*"
isort = "*"
autoflake = "^2.3.1"

[tool.poetry.scripts]
bisimulation-example = "bisimulation_example.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 120

[tool.autoflake]
recursive = true
expand-star-imports = true
remove-all-unused-imports = true
ignore-init-module-imports = true
remove-duplicate-keys = true
remove-unused-variables = true

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.mypy]
disallow_untyped_defs = true
